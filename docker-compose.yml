version: '3.8'

services:
  ibp-forecast:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "443:8001"  # Map host port 443 to container port 8001
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./forecast_processor.log:/app/forecast_processor.log
      - ./cert.pem:/app/cert.pem:ro
      - ./privkey.pem:/app/privkey.pem:ro
    restart: unless-stopped
    networks:
      - ibp-network

networks:
  ibp-network:
    driver: bridge