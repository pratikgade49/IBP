version: '3.8'

services:
  ibp-forecast:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "443:8001"  # Map host port 443 to container port 8001
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./cert.pem:/app/cert.pem:ro
      - ./privkey.pem:/app/privkey.pem:ro
      - ./server.cfg:/app/server.cfg:ro
    restart: unless-stopped
    networks:
      - ibp-network

networks:
  ibp-network:
    driver: bridge
