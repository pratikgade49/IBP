version: '3.8'

services:
  ibp-forecast:
    build:
      context: .
      dockerfile: dockerfile
    expose:
      - "8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./forecast_processor.log:/app/forecast_processor.log
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert.pem:/etc/ssl/certs/cert.pem:ro
      - ./privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      - ibp-forecast
    restart: unless-stopped